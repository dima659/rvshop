<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a"><title>RAVOUT SHMOT</title>
<!-- Скрипт Telegram: даёт window.Telegram.WebApp внутри Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;background:#0a0a0a;color:#f4f4f4;font:400 14px/1.45 Inter,sans-serif;touch-action:pan-y}
#app{min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom));overflow-wrap:anywhere}
img{max-width:100%;display:block}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #ff3b30;outline-offset:2px}
.d{font:800 15px/1.15 Unbounded,sans-serif;text-transform:uppercase;margin:0}
.m{color:#a0a0a0}.rd{color:#ff3b30}.u{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.b{display:flex;align-items:center;justify-content:center;background:#e10600;color:#fff;border:0;border-radius:12px;min-height:48px;padding:0 16px;font:600 11px Unbounded,sans-serif;text-transform:uppercase;letter-spacing:.05em;width:100%;cursor:pointer;text-align:center}
.b.o{background:transparent;border:1.5px solid #3a3a3a}.b.s{min-height:38px;width:auto;font-size:10px}.b:disabled{opacity:.5}
.t{background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:left}
.cd{background:#151515;border:1px solid #262626;border-radius:16px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.g{display:flex;flex-direction:column;gap:12px}
.in{width:100%;min-height:48px;background:#151515;border:1px solid #262626;border-radius:12px;padding:0 14px;outline:0}
textarea.in{padding:12px 14px;min-height:84px;resize:none}.in:focus{border-color:#e10600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.ch{border:1px solid #333;border-radius:20px;padding:0 14px;min-height:38px;display:inline-flex;align-items:center;background:none;cursor:pointer;font-size:13px}
.ch.on{background:#e10600;border-color:#e10600;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}
.ph{background:#1b1b1b;border-radius:14px;aspect-ratio:3/4;object-fit:cover;width:100%;display:flex;align-items:center;justify-content:center;color:#9a9a9a;font-size:11px;letter-spacing:.1em}
.pr{font:600 13px Unbounded,sans-serif;color:#ff3b30;margin-top:4px}
.sg{display:flex;background:#151515;border:1px solid #262626;border-radius:14px;padding:4px;gap:4px}
.sg button{flex:1;border:0;background:none;padding:12px 0;border-radius:10px;font:600 11px Unbounded,sans-serif;text-transform:uppercase;color:#a0a0a0;cursor:pointer}
.sg .on{background:#e10600;color:#fff}
.dz{position:relative;border:1.5px dashed #3a3a3a;border-radius:16px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:28px;overflow:hidden}
.dz i{position:absolute;width:22px;height:22px;border:3px solid #e10600}
.dz i:nth-child(1){top:10px;left:10px;border-right:0;border-bottom:0}.dz i:nth-child(2){top:10px;right:10px;border-left:0;border-bottom:0}
.dz i:nth-child(3){bottom:10px;left:10px;border-right:0;border-top:0}.dz i:nth-child(4){bottom:10px;right:10px;border-left:0;border-top:0}
.dz img{max-height:260px;object-fit:contain;border-radius:10px}
.r{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 16px;border-top:1px solid #262626;width:100%}
.r:first-child{border-top:0}
.st{font-size:11px;font-weight:600;color:#ff3b30}
.tb{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0f0f0f;border-top:1px solid #262626;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tb button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#a0a0a0;position:relative;cursor:pointer}
.tb .on{color:#ff3b30}.bd{position:absolute;top:4px;left:calc(50% + 6px);background:#e10600;color:#fff;border-radius:9px;min-width:18px;height:18px;font:600 10px/18px Inter;text-align:center;font-style:normal;letter-spacing:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.ov.c{align-items:center;padding:20px}.sh{background:#0a0a0a;border:1px solid #262626;border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));overflow-wrap:anywhere}
.ov.c .sh{border-radius:28px;position:relative;text-align:center;padding:44px 24px 24px}
.x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:22px;border:0;background:#1d1d1d;display:flex;align-items:center;justify-content:center;cursor:pointer}
#toast{position:fixed;left:16px;right:16px;bottom:96px;background:#f4f4f4;color:#0a0a0a;border-radius:12px;padding:12px 16px;font-weight:500;z-index:20;text-align:center;display:none}
#ld{position:fixed;inset:0;background:#0a0a0a;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
</style></head><body>
<div id="ld"><img src="/art.png" alt="RAVOUT SHMOT" width="330" height="330"><div style="width:200px;height:6px;border-radius:3px;background:#262626;overflow:hidden"><div id="bar" style="width:8%;height:100%;background:#e10600;transition:width .3s"></div></div><div class="u m">Загружаем дроп</div></div>
<div id="app"></div><div id="toast" role="status"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp,LIVE='https://t.me/Ravoutshmotlive',MAIN='https://t.me/ravoutshmot',REV='https://t.me/+FzS02Thp7yY5YjYy';
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#0a0a0a');tg.setBackgroundColor('#0a0a0a');tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n>0?n.toLocaleString('ru-RU')+' ₽':'Цена по запросу',date=t=>new Date(t*1000).toLocaleDateString('ru-RU');
const link=u=>tg?tg.openTelegramLink(u):open(u,'_blank');
const RS={new:'Новая',work:'В работе',done:'Выполнена',rejected:'Отклонена'},OS={new:'Новый',work:'В работе',shipped:'Отправлен',done:'Завершён',cancel:'Отменён'};
async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','X-Init-Data':tg?tg.initData:''},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){if(j.error==='subscribe'){S.subd=false;gate()}throw new Error(j.error==='subscribe'?'Подпишитесь на канал, чтобы продолжить':(j.error||'Нет связи с сервером'))}return j}
const S={me:null,products:[],cart:JSON.parse(localStorage.cart||'{}'),tab:'catalog',sub:'',cat:'Все',mode:'photo',photo:null,at:'products',edit:null,ep:'',f:{},my:{requests:[],orders:[]},adm:null};
const P='M12 2l3 7 7 .6-5.4 4.7 1.7 7.2L12 17.8 5.7 21.5l1.7-7.2L2 9.6 9 9z',star=z=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" aria-hidden="true"><path d="${P}" fill="#ffd400"/></svg>`;
const ic={catalog:'<rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',cart:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',cam:'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/>',chev:'<path d="M9 6l6 6-6 6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const I=(k,z=22)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[k]}</svg>`;
const V=(k,d='')=>esc(S.f[k]??d),cartN=()=>Object.values(S.cart).reduce((a,b)=>a+b,0),saveCart=()=>localStorage.cart=JSON.stringify(S.cart);
const cats=()=>['Все',...new Set(['Куртки','Штаны','Обувь','Аксессуары',...S.products.map(p=>p.category).filter(Boolean)])];
const pic=p=>p.photo?`<img class="ph" src="${esc(p.photo)}" alt="${esc(p.title)}" loading="lazy">`:'<div class="ph">ФОТО</div>';
const mark=()=>`<div class="row" style="gap:8px">${star(18)}<span class="d rd">Ravout Shmot</span></div>`;
const head=t=>`<div class="row sp" style="padding:16px 0 12px"><h2 class="d" style="font-size:22px">${t}</h2></div>`;
const back='<button class="t u m" data-a="back" style="min-height:44px">‹ Назад</button>';
const card=p=>`<button class="t" data-a="open" data-id="${p.id}">${pic(p)}<div class="u m" style="margin-top:10px">${esc(p.brand)}</div><div>${esc(p.title)}</div><div class="pr">${money(p.price)}</div></button>`;
const found=q=>{const w=q.toLowerCase().split(/\s+/).filter(Boolean);return w.length?S.products.filter(p=>w.every(x=>(p.title+' '+p.brand+' '+p.category+' '+p.desc).toLowerCase().includes(x))):[]};
const opts=(m,cur)=>Object.entries(m).map(([k,l])=>`<option value="${k}" ${k===cur?'selected':''}>${l}</option>`).join('');

function catalog(){const l=S.products.filter(p=>S.cat==='Все'||p.category===S.cat);return `<div class="row sp" style="padding:16px 0 12px">${mark()}<button class="t" data-a="tab" data-t="cart" aria-label="Корзина" style="width:44px;height:44px;display:flex;align-items:center;justify-content:flex-end">${I('cart')}</button></div>
<button class="cd row" data-a="tab" data-t="search" style="width:100%;height:48px;border-radius:24px;padding:0 14px;text-align:left;cursor:pointer"><span class="m">${I('search',20)}</span><span class="m" style="flex:1">Поиск по фото или описанию</span><span class="rd">${I('cam')}</span></button>
<div class="chips">${cats().map(c=>`<button class="ch ${c===S.cat?'on':''}" data-a="cat" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
<div class="cd row" style="overflow:hidden;min-height:132px"><div style="flex:1;padding:16px"><div class="u rd row" style="gap:6px">${star(13)}Новый дроп</div><h2 class="d" style="font-size:17px;margin:8px 0 12px">Вещи из Китая<br>напрямую</h2><button class="b s" data-a="tab" data-t="search">Найти вещь</button></div><img src="/art.png" alt="" width="132" height="132"></div>
<div class="row sp" style="margin:18px 0 12px"><span class="d" style="font-size:13px">Каталог</span><span class="u m">${l.length} шт.</span></div>
${l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p class="m">Здесь пока пусто. Загляните позже или оставьте заявку на вещь в поиске.</p>'}`}

function search(){const ph=S.mode==='photo';return head('Поиск')+`<div class="sg"><button class="${ph?'on':''}" data-a="mode" data-m="photo">По фото</button><button class="${ph?'':'on'}" data-a="mode" data-m="text">По описанию</button></div><div class="g" style="margin-top:16px">`+(ph?
`<div class="dz"><i></i><i></i><i></i><i></i>${S.photo?`<img src="${S.photo}" alt="Ваше фото">`:`<span class="rd">${I('cam',40)}</span><div class="d" style="font-size:15px">Загрузите фото вещи</div><div class="m">Найдём такую же или похожую у поставщиков из Китая</div>`}</div>
<div class="row"><label class="b" style="flex:1">Сделать фото<input type="file" accept="image/*" capture="environment" hidden data-f="req"></label><label class="b o" style="flex:1">Из галереи<input type="file" accept="image/*" hidden data-f="req"></label></div>
<textarea class="in" data-k="note" placeholder="Размер, цвет, бюджет (необязательно)" aria-label="Комментарий к фото">${V('note')}</textarea>
<button class="b" data-a="sendReq" ${S.photo?'':'disabled'}>Отправить заявку</button><p class="m" style="margin:0">Ответ придёт в Telegram. Статус заявки смотрите в профиле.</p>`:
`<input class="in" data-k="q" placeholder="Например: красная куртка с нашивкой" aria-label="Описание вещи" value="${V('q')}"><div id="res">${res()}</div>`)+'</div>'}
function res(){const q=(S.f.q||'').trim(),l=found(q);if(q.length<2)return '<p class="m">Опишите вещь: название, цвет, бренд. Покажем совпадения из каталога.</p>';
return (l.length?`<div class="cd" style="overflow:hidden">${l.map(p=>`<button class="r t" data-a="open" data-id="${p.id}"><span class="row"><span style="width:44px;flex:none">${pic(p)}</span><span>${esc(p.title)}<br><span class="pr">${money(p.price)}</span></span></span><span class="m">${I('chev',18)}</span></button>`).join('')}</div>`:'<p class="m">В каталоге такого нет.</p>')+`<button class="b o" style="margin-top:12px" data-a="sendReq">Не нашли? Оставить заявку</button>`}

function cart(){const it=Object.entries(S.cart).map(([id,q])=>[S.products.find(p=>p.id==id),q]).filter(x=>x[0]),tot=it.reduce((a,[p,q])=>a+p.price*q,0);
if(!it.length)return head('Корзина')+'<p class="m">Корзина пуста. Выберите вещи в каталоге или отправьте заявку на поиск.</p><button class="b" data-a="tab" data-t="catalog">В каталог</button>';
return head('Корзина')+`<div class="cd" style="overflow:hidden">${it.map(([p,q])=>`<div class="r" style="padding:10px 16px;gap:10px"><span style="width:52px;flex:none">${pic(p)}</span><span style="flex:1">${esc(p.title)}<br><span class="pr">${money(p.price)}</span></span><span class="row" style="gap:4px"><button class="ch" data-a="dec" data-id="${p.id}" aria-label="Меньше" style="width:38px;justify-content:center;padding:0">−</button><b>${q}</b><button class="ch" data-a="inc" data-id="${p.id}" aria-label="Больше" style="width:38px;justify-content:center;padding:0">+</button></span></div>`).join('')}</div>
<div class="row sp" style="margin:16px 0"><span class="u m">Итого</span><span class="pr" style="font-size:18px">${tot?money(tot):'по запросу'}</span></div>
<div class="g"><input class="in" data-k="contact" aria-label="Контакт" placeholder="Как с вами связаться" value="${V('contact',S.me&&S.me.username?'@'+S.me.username:'')}"><textarea class="in" data-k="comment" placeholder="Комментарий: размеры, адрес доставки" aria-label="Комментарий">${V('comment')}</textarea><button class="b" data-a="order">Оформить заказ</button></div>`}

function list(){return back+head(S.sub==='requests'?'Мои заявки':'Мои заказы')+(S.sub==='requests'?(S.my.requests.length?S.my.requests.map(r=>`<div class="cd" style="padding:14px;margin-bottom:12px"><div class="row sp"><b>Заявка #${r.id}</b><span class="st">${RS[r.status]}</span></div><div class="m u" style="margin:4px 0 8px">${date(r.ts)}</div>${r.photo?`<img class="ph" src="${esc(r.photo)}" alt="" style="aspect-ratio:auto;max-height:200px;object-fit:contain">`:''}<p>${esc(r.text)}</p>${r.reply?`<p class="rd">Ответ: ${esc(r.reply)}</p>`:''}</div>`).join(''):'<p class="m">Заявок пока нет. Отправьте фото или описание вещи в поиске.</p>'):
(S.my.orders.length?S.my.orders.map(o=>`<div class="cd" style="padding:14px;margin-bottom:12px"><div class="row sp"><b>Заказ #${o.id}</b><span class="st">${OS[o.status]}</span></div><div class="m u" style="margin:4px 0 8px">${date(o.ts)}</div>${o.items.map(x=>`<div>${esc(x.title)} × ${x.qty}</div>`).join('')}<div class="pr">${o.total?money(o.total):'Цена по запросу'}</div></div>`).join(''):'<p class="m">Заказов пока нет.</p>'))}

function profile(){if(S.sub==='admin')return admin();if(S.sub)return list();const m=S.me;return head('Профиль')+`<div class="g"><div class="cd row" style="padding:12px 16px 12px 8px;gap:14px"><img src="/art.png" alt="" width="104" height="104"><div><div class="d" style="font-size:16px">${esc(m.name||'Гость')}</div><div class="m">${m.username?'@'+esc(m.username):''}</div><div class="row" style="gap:3px;margin-top:10px">${star(16)}${star(16)}${star(16)}</div></div></div>
<div class="cd row" style="text-align:center"><div style="flex:1;padding:14px 0"><div class="d" style="font-size:22px">${S.my.requests.length}</div><div class="u m" style="font-size:10px">Заявки</div></div><div style="flex:1;padding:14px 0;border-left:1px solid #262626"><div class="d" style="font-size:22px">${S.my.orders.length}</div><div class="u m" style="font-size:10px">Заказы</div></div></div>
<div style="background:#e10600;border-radius:16px;padding:16px"><div class="d" style="font-size:14px">Наш Telegram</div><p style="margin:8px 0 14px">Дропы, скидки и новинки выходят в основном канале.</p><button class="b" style="background:#fff;color:#0a0a0a" data-a="main">Открыть канал</button></div><div class="cd" style="padding:16px"><div class="row" style="gap:6px">${star(16)}${star(16)}${star(16)}${star(16)}${star(16)}</div><div class="d" style="font-size:14px;margin-top:10px">Отзывы клиентов</div><p class="m" style="margin:8px 0 14px">Реальные отзывы и фото покупателей. Загляните перед заказом.</p><button class="b" data-a="rev">Читать отзывы</button></div>
<div class="cd" style="overflow:hidden"><button class="r t" data-a="sub" data-s="requests">Мои заявки<span class="m">${I('chev',18)}</span></button><button class="r t" data-a="sub" data-s="orders">Мои заказы<span class="m">${I('chev',18)}</span></button>${S.admin?`<button class="r t rd" data-a="sub" data-s="admin">Админ-панель<span>${I('chev',18)}</span></button>`:''}</div></div>`}

function admin(){const d=S.adm;if(!d)return back+head('Админ')+'<p class="m">Загрузка…</p>';const n=a=>a.filter(x=>x.status==='new').length;
const tabs=[['products','Товары'],['requests','Заявки '+n(d.requests)],['orders','Заказы '+n(d.orders)]];
let b='';if(S.at==='products')b=S.edit?pform():`<button class="b" data-a="newP">Добавить товар</button><div class="cd" style="margin-top:12px;overflow:hidden">${d.products.map(p=>`<button class="r t" data-a="editP" data-id="${p.id}"><span class="row"><span style="width:44px;flex:none">${pic(p)}</span><span>${esc(p.title)}${p.active?'':' <span class="st">скрыт</span>'}<br><span class="m">${esc(p.category)} · ${money(p.price)}</span></span></span><span class="m">${I('chev',18)}</span></button>`).join('')||'<p class="m" style="padding:16px">Товаров нет</p>'}</div>`;
else if(S.at==='requests')b=d.requests.map(r=>`<div class="cd g" style="padding:14px;margin-bottom:12px"><div class="row sp"><b>#${r.id} ${esc(r.name)} ${r.uname?'@'+esc(r.uname):''}</b><span class="st">${RS[r.status]}</span></div><div class="m u">${date(r.ts)}</div>${r.photo?`<a href="${esc(r.photo)}" target="_blank" rel="noopener"><img class="ph" src="${esc(r.photo)}" alt="Фото заявки" style="aspect-ratio:auto;max-height:260px;object-fit:contain"></a>`:''}${r.text?`<div>${esc(r.text)}</div>`:''}<select class="in" data-k="rs${r.id}" aria-label="Статус">${opts(RS,S.f['rs'+r.id]??r.status)}</select><textarea class="in" data-k="rr${r.id}" placeholder="Ответ клиенту — придёт в Telegram">${V('rr'+r.id,r.reply)}</textarea><button class="b" data-a="saveReq" data-id="${r.id}">Сохранить</button></div>`).join('')||'<p class="m">Заявок нет</p>';
else b=d.orders.map(o=>`<div class="cd g" style="padding:14px;margin-bottom:12px"><div class="row sp"><b>#${o.id} ${esc(o.name)} ${o.uname?'@'+esc(o.uname):''}</b><span class="st">${OS[o.status]}</span></div><div class="m u">${date(o.ts)}</div>${o.items.map(x=>`<div>${esc(x.title)} × ${x.qty}</div>`).join('')}<div class="pr" style="margin:0">${o.total?money(o.total):'Цена по запросу'}</div><div>Контакт: ${esc(o.contact)}</div>${o.comment?`<div class="m">${esc(o.comment)}</div>`:''}<select class="in" data-k="os${o.id}" aria-label="Статус">${opts(OS,S.f['os'+o.id]??o.status)}</select><button class="b" data-a="saveOrd" data-id="${o.id}">Сохранить</button></div>`).join('')||'<p class="m">Заказов нет</p>';
return back+head('Админ-панель')+`<div class="chips" style="margin-top:0">${tabs.map(([k,l])=>`<button class="ch ${S.at===k?'on':''}" data-a="adm" data-s="${k}">${l}</button>`).join('')}</div>`+b}
function pform(){const e=S.edit;return `<div class="g"><button class="t u m" data-a="adm" data-s="products" style="min-height:44px">‹ К списку</button><input class="in" data-k="pt" placeholder="Название" aria-label="Название" value="${V('pt')}"><input class="in" data-k="pb" placeholder="Бренд" aria-label="Бренд" value="${V('pb')}"><input class="in" data-k="pc" list="cl" placeholder="Категория" aria-label="Категория" value="${V('pc')}"><datalist id="cl">${cats().slice(1).map(c=>`<option value="${esc(c)}">`).join('')}</datalist><input class="in" data-k="pp" type="number" min="0" inputmode="numeric" placeholder="Цена, ₽ (0 — по запросу)" aria-label="Цена" value="${V('pp')}"><textarea class="in" data-k="pd" placeholder="Описание">${V('pd')}</textarea>${S.ep?`<img class="ph" src="${esc(S.ep)}" alt="" style="aspect-ratio:auto;max-height:240px;object-fit:contain">`:''}<label class="b o">${S.ep?'Заменить фото':'Загрузить фото'}<input type="file" accept="image/*" hidden data-f="prod"></label><label class="row"><input type="checkbox" data-k="pa" ${(S.f.pa??true)?'checked':''} style="width:22px;height:22px;accent-color:#e10600"> Показывать в каталоге</label><button class="b" data-a="saveP">Сохранить товар</button>${e.id?'<button class="b o" data-a="delP">Удалить товар</button>':''}</div>`}

function render(){const y=scrollY;$('#app').innerHTML=({catalog,search,cart,profile})[S.tab]()+`<nav class="tb">${[['catalog','Каталог'],['search','Поиск'],['cart','Корзина'],['profile','Профиль']].map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-t="${k}">${I(k)}${l}${k==='cart'&&cartN()?`<i class="bd">${cartN()}</i>`:''}</button>`).join('')}</nav>`;scrollTo(0,y);bb()}
function bb(){if(!tg||!tg.BackButton)return;(S.sub||$('#ov'))?tg.BackButton.show():tg.BackButton.hide()}
if(tg&&tg.BackButton)tg.BackButton.onClick(()=>A.back());
function ov(h,c,lock){closeOv();const e=document.createElement('div');e.id='ov';e.className='ov '+(c?'c':'');if(lock)e.dataset.lock=1;e.innerHTML=`<div class="sh" role="dialog" aria-modal="true">${h}</div>`;e.addEventListener('click',x=>{if(x.target===e&&!lock)closeOv()});document.body.append(e);bb()}
function closeOv(){const e=$('#ov');e&&e.remove();bb()}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600)}
const shrink=f=>new Promise((ok,no)=>{const im=new Image,u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82))};im.onerror=()=>no(new Error('Не удалось прочитать фото'));im.src=u});
const loadMy=async()=>S.my=await api('my'),loadAdm=async()=>S.adm=await api('admin');
const A={
tab:async d=>{S.tab=d.t;S.sub='';S.edit=null;closeOv();render();scrollTo(0,0);if(d.t==='profile'){await loadMy();render()}},
cat:d=>{S.cat=d.c;render()},
open:d=>{const p=S.products.find(x=>x.id==d.id);ov(`${pic(p)}<div class="u m" style="margin-top:14px">${esc(p.brand)}</div><h3 class="d" style="font-size:18px;margin:6px 0">${esc(p.title)}</h3><div class="pr" style="font-size:16px">${money(p.price)}</div><p class="m">${esc(p.desc)}</p><div class="g"><button class="b" data-a="add" data-id="${p.id}">В корзину</button><button class="b o" data-a="close">Закрыть</button></div>`)},
close:closeOv,
add:d=>{S.cart[d.id]=(S.cart[d.id]||0)+1;saveCart();closeOv();toast('Добавлено в корзину');render()},
inc:d=>{S.cart[d.id]=Math.min(99,(S.cart[d.id]||0)+1);saveCart();render()},
dec:d=>{S.cart[d.id]--;if(S.cart[d.id]<1)delete S.cart[d.id];saveCart();render()},
mode:d=>{S.mode=d.m;render()},
sendReq:async()=>{const ph=S.mode==='photo',text=((ph?S.f.note:S.f.q)||'').trim();if(ph&&!S.photo)return toast('Добавьте фото');if(!ph&&text.length<3)return toast('Опишите вещь подробнее');
await api('request',{text,photo:ph?S.photo:''});S.photo=null;S.f.note='';S.f.q='';toast('Заявка отправлена. Ответим в Telegram');S.tab='profile';S.sub='requests';await loadMy();render();scrollTo(0,0)},
order:async()=>{await api('order',{items:Object.entries(S.cart).map(([id,qty])=>({id:+id,qty})),contact:S.f.contact??(S.me.username?'@'+S.me.username:''),comment:S.f.comment||''});S.cart={};saveCart();S.f.comment='';toast('Заказ оформлен. Свяжемся с вами');S.tab='profile';S.sub='orders';await loadMy();render();scrollTo(0,0)},
sub:async d=>{S.sub=d.s;S.at='products';S.edit=null;render();scrollTo(0,0);if(d.s==='admin')await loadAdm();else await loadMy();render()},
back:()=>{const o=$('#ov');if(o)return o.dataset.lock?0:closeOv();if(S.edit){S.edit=null}else S.sub='';render()},
main:()=>link(MAIN),
subscribe:()=>link(LIVE),checkSub:()=>chkSub(false),rev:()=>link(REV),
adm:d=>{S.at=d.s;S.edit=null;render()},
newP:()=>{S.edit={};S.ep='';Object.assign(S.f,{pt:'',pb:'',pc:'',pp:'',pd:'',pa:true});render();scrollTo(0,0)},
editP:d=>{const p=S.adm.products.find(x=>x.id==d.id);S.edit=p;S.ep=p.photo;Object.assign(S.f,{pt:p.title,pb:p.brand,pc:p.category,pp:p.price,pd:p.desc,pa:!!p.active});render();scrollTo(0,0)},
saveP:async()=>{const f=S.f;if(!(f.pt||'').trim())return toast('Введите название');await api('admin/product',{id:S.edit.id,title:f.pt,brand:f.pb,category:f.pc,price:+f.pp||0,desc:f.pd,photo:S.ep,active:f.pa!==false});S.edit=null;await Promise.all([loadAdm(),refresh()]);toast('Товар сохранён');render()},
delP:async()=>{if(!confirm('Удалить товар?'))return;await api('admin/product/delete',{id:S.edit.id});S.edit=null;await Promise.all([loadAdm(),refresh()]);toast('Товар удалён');render()},
saveReq:async d=>{await api('admin/request',{id:+d.id,status:S.f['rs'+d.id]??S.adm.requests.find(r=>r.id==d.id).status,reply:S.f['rr'+d.id]??S.adm.requests.find(r=>r.id==d.id).reply});await loadAdm();toast('Сохранено, клиент уведомлён');render()},
saveOrd:async d=>{await api('admin/order',{id:+d.id,status:S.f['os'+d.id]??S.adm.orders.find(r=>r.id==d.id).status});await loadAdm();toast('Сохранено, клиент уведомлён');render()}};
function gate(){if($('#ov')&&$('#ov').dataset.lock)return;ov(`<div style="width:84px;height:84px;border-radius:42px;background:#2aabee;margin:0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 0 36px rgba(42,171,238,.45)"><svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true"><path d="M3.5 11.2L20 4.6c.8-.3 1.5.2 1.2 1.4l-2.8 13.2c-.2.9-.8 1.1-1.5.7l-4.1-3-2 1.9c-.2.2-.4.4-.8.4l.3-4.2 7.6-6.9c.3-.3-.1-.4-.5-.2l-9.4 5.9-4-1.3c-.9-.3-.9-.9.2-1.3z" fill="#fff"/></svg></div><div class="row" style="justify-content:center;gap:6px;margin-top:22px">${star(14)}${star(18)}${star(14)}</div><h2 class="d" style="font-size:21px;line-height:1.25;margin-top:12px">Подпишись на наш<br>Telegram</h2><p class="m" style="font-size:14px;line-height:1.55;margin:14px 0 24px">Чтобы пользоваться магазином, подпишитесь на наш live-канал: там новые дропы, скидки и подборки вещей из Китая. После подписки нажмите «Я подписался».</p><div class="g" style="gap:8px"><button class="b" data-a="subscribe" style="min-height:54px">Подписаться на Telegram</button><button class="b o" data-a="checkSub" style="min-height:54px">Я подписался</button></div>`,true,true)}
async function chkSub(silent){const d=await api('sub');if(d.subscribed){S.subd=true;closeOv();toast('Спасибо за подписку!');render()}else if(!silent)toast('Подписка не найдена. Подпишитесь на канал и нажмите снова')}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.subd===false)chkSub(true).catch(()=>{})});
const refresh=async()=>S.products=(await api('init')).products;
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el||!A[el.dataset.a])return;if(el.disabled)return;el.disabled=true;try{await A[el.dataset.a](el.dataset,el)}catch(x){toast(x.message)}if(el.isConnected)el.disabled=false});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;S.f[k]=t.type==='checkbox'?t.checked:t.value;if(k==='q')$('#res').innerHTML=res()});
document.addEventListener('change',async e=>{const t=e.target,w=t.dataset.f;if(!w||!t.files[0])return;try{const u=await shrink(t.files[0]);if(w==='req')S.photo=u;else S.ep=u;render()}catch(x){toast(x.message)}});
(async()=>{const t0=Date.now(),bar=$('#bar');let w=10;const iv=setInterval(()=>bar.style.width=(w=Math.min(90,w+6))+'%',150);let err='';
try{const d=await api('init');S.me=d.user;S.admin=d.admin;S.products=d.products;S.subd=d.subscribed}catch(x){err=x.message}
await new Promise(r=>setTimeout(r,Math.max(0,1500-(Date.now()-t0))));clearInterval(iv);bar.style.width='100%';
if(err){$('#ld').innerHTML=`<div class="d rd" style="font-size:20px;text-align:center">Ravout<br>Shmot</div><p class="m" style="text-align:center;padding:0 24px">${esc(err)}</p>`;return}
$('#ld').remove();render();loadMy().then(()=>S.tab==='profile'&&render()).catch(()=>{});
if(!S.subd)gate()})();
</script></body></html>
